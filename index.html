function App(){const[tab,setTab]=useState('learn'),[mode,setMode]=useState(()=>localStorage.getItem('mathe-last-mode')||'add'),[digits,setDigits]=useState(3),[ma,setMa]=useState(3),[mb,setMb]=useState(2),[a,setA]=useState(347),[b,setB]=useState(26),[msg,setMsg]=useState(''),[toast,setToast]=useState('');const make=(m=mode,d=digits)=>{let x=num(d),y=num(d);if(m==='sub'&&y>x)[x,y]=[y,x];if(m==='div'){y=rand(2,9);x=num(d)}setA(x);setB(y);setMsg('')},makeMul=(da=ma,db=mb)=>{setA(num(da));setB(num(db));setMsg('')},reward=()=>{let taskXp=(mode==='mul'||mode==='div')?2:1,res=cityCorrect(taskXp);setMsg(`✓ Richtig! · +1 Auftrag · +${taskXp} XP`);if(res.levelUp){let z=cityLoad(),l=levelFor(z.xp);setToast(`⭐ Neues Karriere-Level! ${LEVELS[l].title} · Level ${l+1}`);setTimeout(()=>setToast(''),2800)}};return <div className="min-h-screen bg-slate-200 p-2"><div className="mx-auto min-h-[820px] max-w-[430px] space-y-4 rounded-[32px] border-[7px] border-slate-900 bg-gradient-to-b from-sky-100 to-emerald-50 p-3 pb-24"><header className="flex justify-between"><div><h1 className="text-2xl font-black">Mathe-Abenteuer</h1><p className="text-xs">Schriftlich rechnen und Mathe City entwickeln.</p></div><MissionMini/></header>{tab==='learn'?<><section className="rounded-2xl bg-white p-4"><select value={mode} onChange={e=>{let m=e.target.value;setMode(m);localStorage.setItem('mathe-last-mode',m);m==='mul'?makeMul():make(m,digits)}} className="w-full rounded-xl border p-3 font-bold">{OPS.map(([id,l])=><option key={id} value={id}>{l}</option>)}</select>{mode==='mul'?<div className="mt-3 space-y-2"><div><b className="text-xs">1. Zahl</b><div className="grid grid-cols-4 gap-1">{[2,3,4,5].map(d=><button key={d} onClick={()=>{setMa(d);makeMul(d,mb)}} className={`rounded-xl border p-2 ${ma===d?'bg-slate-900 text-white':''}`}>{d}-stellig</button>)}</div></div><div><b className="text-xs">2. Zahl</b><div className="grid grid-cols-3 gap-1">{[1,2,3].map(d=><button key={d} onClick={()=>{setMb(d);makeMul(ma,d)}} className={`rounded-xl border p-2 ${mb===d?'bg-slate-900 text-white':''}`}>{d}-stellig</button>)}</div></div></div>:<div className="mt-3 grid grid-cols-4 gap-1">{[2,3,4,5].map(d=><button key={d} onClick={()=>{setDigits(d);make(mode,d)}} className={`rounded-xl border p-2 ${digits===d?'bg-slate-900 text-white':''}`}>{d}-stellig</button>)}</div>}</section><section className="rounded-2xl bg-white p-4"><div className="mb-4 flex justify-between"><b>Schriftlich rechnen</b><button onClick={()=>mode==='mul'?makeMul():make(mode,digits)} className="rounded-xl border px-3 py-2">Neue Aufgabe</button></div>{mode==='mul'?<Multiply a={a} b={b} reward={reward}/>:mode==='div'?<Division a={a} b={b} reward={reward}/>:<AddSub mode={mode} a={a} b={b} reward={reward}/>}<div className="mt-2 text-center font-bold">{msg}</div></section></>:<MatheCity/>}{toast&&<div className="fixed left-1/2 top-4 z-50 -translate-x-1/2 rounded-xl bg-amber-300 px-4 py-3 font-black text-slate-900 shadow-xl">{toast}</div>}<nav className="fixed bottom-0 left-1/2 z-40 w-full max-w-[430px] -translate-x-1/2 rounded-b-[32px] border-x-[7px] border-b-[7px] border-slate-900 bg-slate-900 p-2 pb-[calc(8px+env(safe-area-inset-bottom))]"><div className="grid grid-cols-2 gap-2"><button onClick={()=>setTab('learn')} className={`w-full rounded-xl p-3 font-bold ${tab==='learn'?'bg-amber-300 text-slate-900':'bg-slate-700 text-white'}`}>✏️ Lernen</button><button onClick={()=>setTab('planet')} className={`w-full rounded-xl p-3 font-bold ${tab==='planet'?'bg-amber-300 text-slate-900':'bg-slate-700 text-white'}`}>🏙️ Mathe City</button></div></nav></div></div>}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'))}</script></body></html>
